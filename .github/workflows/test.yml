name: Run regression tests

on:
  push:
    branches:
      - main
      - release
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      target_container:
        description: The target container with which to run the suite (full tag, e.g. dev-main)
        type: string
        required: true
        default: dev-main

jobs:
  build:
    name: Benchmark regression test
    runs-on: ubuntu-latest
    container:
      # Prefer specific branch, then PR base, then actual branch
      image: firedrakeproject/firedrake-vanilla-default:${{ inputs.target_container || (github.event_name == 'pull_request' && case(contains(github.event.pull_request.labels.*.name, 'container:main'), 'dev-main', contains(github.event.pull_request.labels.*.name, 'container:release'), 'dev-release', format('dev-{0}', github.base_ref))) || format('dev-{0}', github.ref_name) }}

    concurrency:
      group: testing-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true

    env:
      OMP_NUM_THREADS: 1
      TEST_STREAMS: 8
      UV_EXCLUDE: ${{ github.workspace}}/.uv-exclude.txt

    steps:
      - name: Install prerequisites
        run: |
          apt update
          apt install -y time unzip git-lfs gmsh gcc cmake libsqlite3-dev libhwloc-dev \
              patchelf libgl1-mesa-dev libglu1-mesa-dev libglew-dev \
              libboost-dev libboost-python-dev libboost-thread-dev libboost-program-options-dev \
              libqt5opengl5-dev libqt5svg5-dev libqwt-qt5-dev libqt5xmlpatterns5-dev \
              libgdal-dev libcgal-dev libproj-dev proj-bin zlib1g-dev \
              libgtest-dev
          git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Fix OpenMPI installation
        run: |
            # Remove block on files in /usr/share/doc being installed
            rm /etc/dpkg/dpkg.cfg.d/excludes
            apt reinstall libprrte-dev
            for i in /usr/share/doc/libprrte-dev/*; do
              [[ ${i#*\.} == "txt.gz" ]] && gunzip $i
            done
            ln -s /usr/share/doc/libprrte-dev /usr/lib/x86_64-linux-gnu/prrte3/share/prte
        shell: bash

      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Fetch LFS artifacts
        run: |
          git lfs checkout

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python dependencies
        run: |
          uv venv --system-site-packages
          uv pip install .[demos]

      - name: Pytest
        id: run_pytest
        run: |
          . .venv/bin/activate
          gmsh -2 tests/base_gmsh/square.geo
          curl -fsSLO https://data.gadopt.org/github-actions/test_durations.json
          seq ${TEST_STREAMS} | xargs -P ${TEST_STREAMS} -I{} -- bash -c "python -m pytest -v --splits ${TEST_STREAMS} --group {} -m 'not longtest' --junit-xml=test_results{}.xml --splitting-algorithm least_duration --durations-path=./test_durations.json > job{}.log 2>&1"
        shell: bash

      - name: Display pytest output
        if: ${{ !cancelled() && steps.run_pytest.conclusion != 'skipped' }}
        run: for (( i=1; i<=${TEST_STREAMS}; i++ )); do [[ -f "job${i}.log" ]] && cat "job${i}.log"; done
        shell: bash

      - name: Pytest report
        uses: mikepenz/action-junit-report@v6
        if: ${{ !cancelled() && steps.run_pytest.conclusion != 'skipped' }}
        with:
          check_name: Test suite report
          report_paths: test_results*.xml
          include_passed: true
          annotate_only: true

      - name: Upload run log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: run-log
          path: /tmp/tsp_db.sqlite3

      - name: Cleanup temporary files
        if: always()
        shell: bash
        run: |
          uv cache prune --ci
          . .venv/bin/activate
          # see https://github.com/inducer/pytools/blob/main/pytools/persistent_dict.py#L484
          export PYTOOLS_CACHE_DIR=$( python -c 'import platformdirs; print(platformdirs.user_cache_dir("pytools","pytools"))')
          if [[ "${PYTOOLS_CACHE_DIR}" ]]; then
            echo Cleaning pytools persistent dicts from "${PYTOOLS_CACHE_DIR}"
            rm -rf --preserve-root=all "${PYTOOLS_CACHE_DIR}"
          else
            echo PYTOOLS_CACHE_DIR could not be determined
          fi
